name: Review Or Publish Worksheet Studio

# Preparation only: no push, pull-request, schedule, or automatic deployment trigger.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish publicly after owner approval and Pages setup
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: worksheet-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Append-only build ordinal refs; no source changes.
    outputs:
      id: ${{ steps.build.outputs.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build Identified Artifact
        id: build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: node teacher/pages-test.mjs
      - name: Save Tested Static Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-${{ steps.build.outputs.id }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
      - name: Save Synthetic Verification Evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ steps.build.outputs.id }}
          path: test-results/teacher/${{ steps.build.outputs.id }}/
          if-no-files-found: error

  deploy:
    # All three conditions are required. This variable is intentionally not set now.
    if: inputs.publish && vars.PAGES_PUBLICATION_APPROVED == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Retrieve Exact Tested Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-${{ needs.build.outputs.id }}
          path: site
      - name: Configure Existing Pages Site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Publish Tested Artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
